name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  ci:
    uses: AntelopeJS/.github/.github/workflows/ci-node.yml@v1
    with:
      docs-files: |
        README.md
        docs
      docs-typescript-project: docs/tsconfig.json
      renovate-sync: false
      test-job: true
    permissions:
      contents: read

  formal-scheduler-delivery:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - id: pass
        uses: actions/cache/restore@v4
        with:
          path: .formal-pass
          key: formal-pass-${{ hashFiles('.agents/skills/formal-scheduler-delivery/**', 'package.json', 'pnpm-lock.yaml', '.nvmrc', '.github/workflows/ci.yml') }}
          lookup-only: true
      - if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - if: steps.pass.outputs.cache-hit != 'true'
        run: corepack enable
      - if: steps.pass.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/antelopejs-formal
          key: tla2tools-1.7.4
      - if: steps.pass.outputs.cache-hit != 'true'
        run: node .agents/skills/formal-scheduler-delivery/check.mjs
      - if: steps.pass.outputs.cache-hit != 'true'
        run: mkdir .formal-pass && git rev-parse HEAD > .formal-pass/commit
      - if: steps.pass.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .formal-pass
          key: ${{ steps.pass.outputs.cache-primary-key }}

  checks:
    if: always()
    needs: [ci, formal-scheduler-delivery]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
  renovate-sync:
    if: >-
      github.event_name == 'pull_request' && startsWith(github.head_ref, 'renovate/') && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: write
      actions: write
    uses: AntelopeJS/.github/.github/workflows/ci-renovate-sync.yml@v1
